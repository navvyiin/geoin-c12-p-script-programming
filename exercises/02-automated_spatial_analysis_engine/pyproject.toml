[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-spatial-analysis-engine"
version = "1.0.0"
description = "A modular Python engine for automated, repeatable GIS spatial analysis workflows."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Automated Spatial Analysis Engine"}]
dependencies = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "networkx>=3.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
spatial-engine = "spatial_engine.cli:main"

[tool.setuptools.packages.find]
include = ["spatial_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
