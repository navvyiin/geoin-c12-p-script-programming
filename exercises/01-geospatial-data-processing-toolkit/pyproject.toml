[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-data-processing-toolkit"
version = "1.0.0"
description = "A modular Python toolkit for common vector and raster geospatial data processing."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Geospatial Data Processing Toolkit"}]
license = {text = "MIT"}
dependencies = [
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "fiona>=1.9",
  "rasterio>=1.3",
  "pandas>=2.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
geotool = "geotoolkit.cli:main"

[tool.setuptools.packages.find]
include = ["geotoolkit*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
